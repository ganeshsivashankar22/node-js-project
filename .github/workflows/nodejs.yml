name: Node.js CI

on:
  push:
    branches: 
      - main
    paths:
      - "app/**"
      - "docker-compose.yml"
      - ".github/workflows/nodejs.yml"


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: start server
        run: docker compose up

      

